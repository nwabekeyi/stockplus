server:
  port: 8080

spring:
  application:
    name: stock-mgmt-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stock_management?sslmode=disable}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      max-lifetime: 1800000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: false
  mail:
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_HOST_USER:}
    password: ${EMAIL_HOST_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      time-to-live: 600000

  threads:
    virtual:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:stockMgmtSecretKeyChangeThisInProduction1234567890}
    access-expiration: ${JWT_ACCESS_EXPIRATION:600000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY:}
    public-key: ${PAYSTACK_PUBLIC_KEY:}
    base-url: https://api.paystack.co
  whatsapp:
    api-key: ${WHATSAPP_API_KEY:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    base-url: https://graph.facebook.com/v18.0
  sms:
    api-key: ${SMS_API_KEY:}
    sender-id: ${SMS_SENDER_ID:StockPulse}
    base-url: https://api.smsprovider.com/v1
  webhook:
    whatsapp-verify-token: ${WHATSAPP_VERIFY_TOKEN:stockpulse-whatsapp-verify-token}
    whatsapp-app-secret: ${WHATSAPP_APP_SECRET:}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.stockmgmt: DEBUG
    org.springframework.security: DEBUG